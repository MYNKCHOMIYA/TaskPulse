name: TaskPulse CI Pipeline

# Trigger this pipeline on every git push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Quality Checks & Test Suite
    runs-on: ubuntu-latest

    services:
      # Spin up a temporary PostgreSQL instance for database connectivity checks
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: taskpulse
        ports:
          - 5432:5432
        # Wait until postgres is fully healthy before starting test execution blocks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Check out your code repository inside the GitHub runner workspace
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 2. Set up the specific Python runtime environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' 
          cache-dependency-path: backend/requirements.txt

      # 3. Install all dependencies from your verified requirements file
      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Force install the QA tools just in case they aren't in your requirements.txt yet
          pip install black flake8 pytest-cov

      # 4. Check Code Formatting (Black)
      - name: Check Code Formatting (Black)
        working-directory: ./backend
        run: |
          # The --check flag tells Black to crash the build if the code isn't perfectly formatted
          black . --check

      # 5. Lint Code (Flake8)
      - name: Lint Code (Flake8)
        working-directory: ./backend
        run: |
          # This scans for critical Python syntax errors or undefined variables
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 6. Inject temporary environment variables and run Tests + Coverage
      - name: Run Automated Pytest Engine with Coverage
        working-directory: ./backend
        env:
          SECRET_KEY: temporary_ci_crypt_secret_signing_key_string_for_testing_boundaries
          DATABASE_URL: postgresql+psycopg2://admin:admin@localhost:5432/taskpulse
        run: |
          # Run tests and generate a terminal report showing exactly which lines of code lack test coverage
          python -m pytest -v --cov=. --cov-report=term-missing
